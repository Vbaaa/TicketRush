spring:
  application:
    name: ticketrush
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketrush
    username: ticketrush
    password: ticketrush
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: 60
  booking:
    strategy: naive            # we will switch this to optimistic on Day 4
    hold-minutes: 5
    simulated-latency-ms: 0    # tests widen the race window with this
    expiry-scan-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info