spring:
  application:
    name: ticketrush
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketrush
    username: ticketrush
    password: ticketrush
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info